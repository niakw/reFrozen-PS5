name: PS5 registered WGL graphics probe package

on:
  pull_request:
    paths:
      - 'ps5/graphics/**'
      - 'tests/ps5/ps5_wgl_egl_title_probe.cpp'
      - 'tests/test_ps5_native_wgl_title_recipe.py'
      - 'scripts/ps5/build-native-wgl-title.sh'
      - '.github/workflows/ps5-native-wgl-title.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
      ENCORE_VENDOR_SHA: 1e51d1f3383f149a599e36052aba7d887d4b1f77
      OPENGL_ORIGIN_SHA: ad2807d41cef2681882a9ee0d20808779f74b7cd
      BOILERPLATE_ORIGIN_SHA: 4f531c4b517f80bcb6b1267135848168d2250047
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registered-title recipe and receipt parser
        run: python -m unittest tests.test_ps5_native_wgl_title_recipe tests.test_ps5_wgl_title_receipt -v

      - name: Checkout pinned Encore graphics sources
        uses: actions/checkout@v4
        with:
          repository: niakw/Prospero.Eden-Encore-vendor
          ref: ${{ env.ENCORE_VENDOR_SHA }}
          path: build/encore-vendor
          persist-credentials: false
          sparse-checkout: |
            sources/opengl-source
            sources/opengl-native-boilerplate
          sparse-checkout-cone-mode: true

      - name: Verify graphics and boilerplate provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            'sources/opengl-source/VENDOR-ORIGIN.json': ('opengl-source', '${{ env.OPENGL_ORIGIN_SHA }}'),
            'sources/opengl-native-boilerplate/VENDOR-ORIGIN.json': ('opengl-native-boilerplate', '${{ env.BOILERPLATE_ORIGIN_SHA }}'),
          }
          root=Path('build/encore-vendor')
          for rel,(name,sha) in expected.items():
              d=json.loads((root/rel).read_text())
              assert d['name']==name, d
              assert d['commit']==sha, d
              print(name, d['commit'], 'tracked_files=', d['tracked_files'])
          PY
          cp -a build/encore-vendor/sources/opengl-source build/opengl-source

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build pkg-config bison flex \
            clang-18 lld-18 llvm-18 ccache curl xz-utils ca-certificates unzip \
            python3-mako python3-yaml python3-packaging \
            glslang-tools spirv-tools libegl1-mesa-dev libgl1-mesa-dev
          python -m pip install --disable-pip-version-check \
            'meson==1.10.1' 'PyYAML==6.0.3' 'Mako==1.3.10' 'packaging==25.0'

      - name: Restore OpenGL compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: refrozen-opengl-ccache-${{ env.OPENGL_ORIGIN_SHA }}-${{ env.PS5_SDK_SHA256 }}
          restore-keys: |
            refrozen-opengl-ccache-${{ env.OPENGL_ORIGIN_SHA }}-

      - name: Download and verify Payload SDK v0.42
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/sdk.zip
          printf '%s  %s\n' "$PS5_SDK_SHA256" build/sdk-download/sdk.zip | sha256sum -c -
          unzip -q build/sdk-download/sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang

      - name: Create path-mapped SDK compiler facade
        run: |
          ORIG="$GITHUB_WORKSPACE/build/sdk-root/ps5-payload-sdk"
          WRAP="$GITHUB_WORKSPACE/build/sdk-pathmap"
          rm -rf "$WRAP"
          mkdir -p "$WRAP/bin"
          for entry in "$ORIG"/*; do
            name=$(basename "$entry")
            case "$name" in bin|toolchain) ;; *) ln -s "$entry" "$WRAP/$name" ;; esac
          done
          cp -a "$ORIG/toolchain" "$WRAP/toolchain"
          for tool in "$ORIG"/bin/*; do
            name=$(basename "$tool")
            case "$name" in prospero-clang|prospero-clang++) ;; *) ln -s "$tool" "$WRAP/bin/$name" ;; esac
          done
          cat > "$WRAP/bin/prospero-clang" <<EOF
          #!/usr/bin/env bash
          exec "$ORIG/bin/prospero-clang" "-ffile-prefix-map=$GITHUB_WORKSPACE/=workspace/" "-fmacro-prefix-map=$GITHUB_WORKSPACE/=workspace/" "\$@"
          EOF
          cat > "$WRAP/bin/prospero-clang++" <<EOF
          #!/usr/bin/env bash
          exec "$ORIG/bin/prospero-clang++" "-ffile-prefix-map=$GITHUB_WORKSPACE/=workspace/" "-fmacro-prefix-map=$GITHUB_WORKSPACE/=workspace/" "\$@"
          EOF
          chmod +x "$WRAP/bin/prospero-clang" "$WRAP/bin/prospero-clang++"

      - name: Restore installed OpenGL SDK cache
        id: opengl-cache
        uses: actions/cache@v4
        with:
          path: build/ps5-opengl-sdk
          key: refrozen-ps5-opengl-${{ env.ENCORE_VENDOR_SHA }}-${{ env.PS5_SDK_SHA256 }}-meson-1.10.1-pathmap-v1

      - name: Build audited OpenGL SDK on cache miss
        if: steps.opengl-cache.outputs.cache-hit != 'true'
        working-directory: build/opengl-source
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-pathmap
          PS5_OPENGL_SDK_PREFIX: ${{ github.workspace }}/build/ps5-opengl-sdk
        run: |
          python3 tools/fetch-sources.py
          export PSBC_JOBS="$(nproc)"
          make sdk-gl46
          ccache --show-stats || true
          (cd "$PS5_OPENGL_SDK_PREFIX" && sha256sum --check --strict manifest.sha256)

      - name: Save installed OpenGL SDK cache
        if: steps.opengl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ps5-opengl-sdk
          key: refrozen-ps5-opengl-${{ env.ENCORE_VENDOR_SHA }}-${{ env.PS5_SDK_SHA256 }}-meson-1.10.1-pathmap-v1

      - name: Verify installed OpenGL SDK
        run: (cd build/ps5-opengl-sdk && sha256sum --check --strict manifest.sha256)

      - name: Build registered PPSA99006 title
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-pathmap
          PS5_OPENGL_PREFIX: ${{ github.workspace }}/build/ps5-opengl-sdk
          REFROZEN_OPENGL_SOURCE_ROOT: ${{ github.workspace }}/build/opengl-source
          REFROZEN_NATIVE_TEMPLATE: ${{ github.workspace }}/build/encore-vendor/sources/opengl-native-boilerplate
          BUILD_JOBS: '2'
          USE_CCACHE: '1'
        run: bash scripts/ps5/build-native-wgl-title.sh

      - name: Inspect package and preserve exact receipt
        run: |
          ROOT=build/native-wgl-title/PPSA99006
          DIST="$ROOT/dist/PPSA99006"
          test -s "$DIST/eboot.bin"
          test -s "$DIST/sce_module/libc.prx"
          grep -q '"titleId": "PPSA99006"' "$DIST/sce_sys/param.json"
          file "$DIST/eboot.bin" | tee "$ROOT/build/eboot-file.txt"
          sha256sum "$DIST/eboot.bin" "$DIST/sce_module/libc.prx" | tee "$ROOT/build/dist-sha256.txt"
          strings "$ROOT/build/eboot.elf" > "$ROOT/build/eboot-strings.txt"
          if grep -E 'Warcraft|Blizzard|/home/runner/work/' "$ROOT/build/eboot-strings.txt" > "$ROOT/build/forbidden-strings.txt"; then
            cat "$ROOT/build/forbidden-strings.txt" >&2
            exit 1
          fi
          grep -q 'REFROZEN_PS5_WGL_TITLE pass=%d' "$ROOT/build/eboot-strings.txt"

      - name: Upload registered title and build receipt
        uses: actions/upload-artifact@v4
        with:
          name: refrozen-ps5-PPSA99006-wgl-probe
          path: |
            build/native-wgl-title/PPSA99006/dist/PPSA99006/**
            build/native-wgl-title/PPSA99006/build/title-sha256.txt
            build/native-wgl-title/PPSA99006/build/dist-sha256.txt
            build/native-wgl-title/PPSA99006/build/eboot-file.txt
          if-no-files-found: error
          retention-days: 14
