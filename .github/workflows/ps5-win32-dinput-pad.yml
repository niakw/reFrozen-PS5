name: PS5 Win32 DirectInput native pad gate
on:
  pull_request:
    paths:
      - 'scripts/ps5/patch_x86recomp_runtime_ps5.py'
      - 'tests/test_ps5_win32_raw_input_hook_patch.py'
      - 'ps5/runtime/ps5_dinput_pad_bridge.cpp'
      - 'ps5/runtime/ps5_dinput_pad_bridge.hpp'
      - 'ps5/runtime/ps5_pad_contract.hpp'
      - '.github/workflows/ps5-win32-dinput-pad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directinput-pad:
    runs-on: ubuntu-24.04
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed hook patch test
        run: python3 -m unittest tests.test_ps5_win32_raw_input_hook_patch -v
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl unzip clang-18 llvm-18 lld-18
      - name: Download and verify Payload SDK
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/sdk.zip
          printf '%s  %s\n' "$PS5_SDK_SHA256" build/sdk-download/sdk.zip | sha256sum -c -
          unzip -q build/sdk-download/sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang++
      - name: Materialize patched SwARc runtime
        run: |
          git clone --filter=blob:none https://github.com/JTM-rootstorm/SwARc.git build/x86recomp
          cd build/x86recomp
          git checkout ad1b16b30b3cc049e47a1ebbf96e8066b32191e1
          for patch in "$GITHUB_WORKSPACE"/patches/x86recomp/*.patch; do git apply "$patch"; done
          cd "$GITHUB_WORKSPACE"
          python3 -B scripts/ps5/patch_x86recomp_runtime_ps5.py build/x86recomp
      - name: Compile Win32 RawInput hooks and native DualSense bridge
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-root/ps5-payload-sdk
        run: |
          set -euo pipefail
          CXX="$PS5_PAYLOAD_SDK/bin/prospero-clang++"
          OUT="$GITHUB_WORKSPACE/build/win32-dinput-pad"
          mkdir -p "$OUT"
          "$CXX" -std=c++20 -O0 -g0 -fPIC -Ibuild/x86recomp/src \
            -c build/x86recomp/src/runtime/hle/user32_input.cpp -o "$OUT/user32_input.o"
          "$CXX" -std=c++20 -O0 -g0 -fPIC -Ips5/runtime \
            -c ps5/runtime/ps5_dinput_pad_bridge.cpp -o "$OUT/ps5_dinput_pad_bridge.o"
          ld.lld-18 -r "$OUT/user32_input.o" "$OUT/ps5_dinput_pad_bridge.o" -o "$OUT/directinput-pad.o"
          llvm-readobj-18 --file-headers "$OUT/directinput-pad.o" > "$OUT/elf-header.txt"
          llvm-nm-18 --defined-only "$OUT/directinput-pad.o" | sort -u > "$OUT/defined.txt"
          llvm-nm-18 --undefined-only "$OUT/directinput-pad.o" | sort -u > "$OUT/undefined.txt"
      - name: Verify hook closure and native imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def symbols(path):
              out=set()
              for line in Path(path).read_text().splitlines():
                  parts=line.split()
                  if parts:
                      out.add(parts[-1])
              return out
          defined=symbols('build/win32-dinput-pad/defined.txt')
          undefined=symbols('build/win32-dinput-pad/undefined.txt')
          hooks={'di_key','di_mouse_move','di_mouse_wheel','di_mouse_button'}
          native={'scePadReadState','scePadOpen','scePadClose','scePadInit',
                  'sceUserServiceInitialize','sceUserServiceGetForegroundUser',
                  'sceUserServiceTerminate'}
          assert hooks <= defined, sorted(hooks-defined)
          assert not (hooks & undefined), sorted(hooks & undefined)
          assert native <= undefined, sorted(native-undefined)
          Path('build/win32-dinput-pad/receipt.txt').write_text(
              'REFROZEN_PS5_WIN32_DINPUT_PAD pass=1 hooks=4 '
              'native_imports=scePad,sceUserService\n')
          print(Path('build/win32-dinput-pad/receipt.txt').read_text(), end='')
          PY
      - name: Upload text-only linker evidence
        uses: actions/upload-artifact@v4
        with:
          name: ps5-win32-dinput-pad-evidence
          path: |
            build/win32-dinput-pad/receipt.txt
            build/win32-dinput-pad/elf-header.txt
            build/win32-dinput-pad/defined.txt
            build/win32-dinput-pad/undefined.txt
          if-no-files-found: error
          retention-days: 3
