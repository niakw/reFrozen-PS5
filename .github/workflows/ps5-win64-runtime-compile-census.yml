name: PS5 Win64 runtime compile census
on:
  pull_request:
    paths:
      - 'scripts/ps5/compile-win64-runtime-census.sh'
      - 'scripts/ps5/compile-win64-first-launch-runtime.sh'
      - 'scripts/ps5/patch_win64_runtime.py'
      - 'scripts/ps5/patch_win64_rt_ps5.py'
      - 'scripts/ps5/patch_win64_boot_ps5.py'
      - 'ps5/runtime/win64_memory_bridge_ps5.h'
      - 'ps5/runtime/ps5_audio_out_bridge.*'
      - 'ps5/runtime/ps5_dinput_pad_bridge.*'
      - 'ps5/runtime/ps5_win64_frontend_shims.cpp'
      - 'ps5/runtime/ps5_pad_contract.hpp'
      - 'ps5/runtime/commoncrypto_openssl_compat.h'
      - 'tests/ps5/commoncrypto_openssl_compat_test.c'
      - 'tests/ps5/x86_64_fiber_swap_test.c'
      - '.github/workflows/ps5-win64-runtime-compile-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
      PACBREW_URL: https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz
      PACBREW_SHA256: a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Win64 runtime
        uses: actions/checkout@v4
        with:
          repository: NightSightProductions/Recomp-Framework
          ref: 63742ed02e039b292bbf341a33b3bb8c73457fea
          path: build/nightsight
          persist-credentials: false
      - name: Apply fail-closed PS5 portability edits
        run: python scripts/ps5/patch_win64_runtime.py build/nightsight/runtime
      - name: Apply PS5 Win64 core memory edits
        run: python scripts/ps5/patch_win64_rt_ps5.py build/nightsight/runtime
      - name: Apply PS5 Win64 core boot edits
        run: python scripts/ps5/patch_win64_boot_ps5.py build/nightsight/runtime
      - name: Execute x86-64 fiber context switch contract
        run: |
          mkdir -p build
          clang -std=gnu11 -O2 -Wall -Wextra -Werror tests/ps5/x86_64_fiber_swap_test.c -o build/fiber-swap-test
          ./build/fiber-swap-test | tee build/fiber-swap-test.log
          grep -q "x86_64_fiber_swap: PASS" build/fiber-swap-test.log
      - name: Download and verify Payload SDK
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/sdk.zip
          printf '%s  %s\n' "$PS5_SDK_SHA256" build/sdk-download/sdk.zip | sha256sum -c -
          unzip -q build/sdk-download/sdk.zip -d build/sdk-root
      - name: Validate OpenSSL compatibility shim on host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev lld-18 llvm-18
          clang -std=gnu11 -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -Ips5/runtime tests/ps5/commoncrypto_openssl_compat_test.c -lcrypto \
            -o build/commoncrypto-openssl-test
          ./build/commoncrypto-openssl-test | tee build/commoncrypto-openssl-test.log
          grep -q 'commoncrypto_openssl_compat: PASS' build/commoncrypto-openssl-test.log

      - name: Download and verify Encore-compatible PacBrew OpenSSL
        run: |
          mkdir -p build/pacbrew
          curl --fail --location --retry 3 --retry-delay 2 "$PACBREW_URL" -o build/pacbrew.tar.gz
          printf '%s  %s\n' "$PACBREW_SHA256" build/pacbrew.tar.gz | sha256sum -c -
          tar -xzf build/pacbrew.tar.gz -C build/pacbrew
          CDEPS="$GITHUB_WORKSPACE/build/pacbrew/opt/ps5-payload-sdk/target/user/homebrew"
          test -d "$CDEPS/include/openssl"
          test -s "$CDEPS/lib/libcrypto.a"
          echo "REFROZEN_PS5_CDEPS=$CDEPS" >> "$GITHUB_ENV"

      - name: Compile census
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-root/ps5-payload-sdk
        run: |
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=gnu11 -O2 -Wall -Wextra -Werror             -Ips5/runtime -c ps5/runtime/ps5_audio_out_bridge.c             -o build/ps5-audio-out-bridge.o
          test -s build/ps5-audio-out-bridge.o
          bash scripts/ps5/compile-win64-runtime-census.sh build/nightsight/runtime build/runtime-census
          cat build/runtime-census/results.tsv
          echo "== First compiler diagnostics for non-portable units =="
          while read -r unit status; do
            if [[ "$status" == FAIL ]]; then
              echo "--- $unit"
              grep -n -m 8 -E 'fatal error:| error:' "build/runtime-census/logs/$unit.log" || true
              sed -n '1,16p' "build/runtime-census/logs/$unit.log"
            fi
          done < <(tail -n +2 build/runtime-census/results.tsv)
          for unit in bcrypt.c boot.c dinput.c display.c fiber.c files.c handles.c input.c kernel32.c native.c pdh.c rt.c sockets.c spvfix.c system.c teb.c user32.c wasapi.c window.c xaudio2.c xreverb.c; do
            grep -Eq "^${unit}[[:space:]]+PASS$" build/runtime-census/results.tsv
          done
      - name: Compile consumable first-launch runtime object set
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-root/ps5-payload-sdk
          BUILD_JOBS: '2'
        run: |
          bash -n scripts/ps5/compile-win64-first-launch-runtime.sh
          bash scripts/ps5/compile-win64-first-launch-runtime.sh \
            build/nightsight/runtime build/runtime-first-launch
          grep -q 'REFROZEN_PS5_WIN64_RUNTIME_OBJECTS pass=1 runtime_units=21 objects=24 frontend=2 aggregate=1 excluded=steam.c,vulkan.c' \
            build/runtime-first-launch/receipt.txt
          test "$(wc -l < build/runtime-first-launch/objects.list | tr -d ' ')" -eq 24
          test -s build/runtime-first-launch/first-launch-runtime.o
          file build/runtime-first-launch/first-launch-runtime.o
          nm -u build/runtime-first-launch/first-launch-runtime.o | sort -u > build/runtime-first-launch/undefined-symbols.txt
          nm build/runtime-first-launch/first-launch-runtime.o > build/runtime-first-launch/symbols.txt
          echo "== unresolved aggregate symbols =="
          cat build/runtime-first-launch/undefined-symbols.txt
          if grep -Eq ' U (cocoa_|gamepad_|rt_last_surface_hwnd$|rt_request_screenshot$|rt_vk_(skip_next|snapshot_request)$)' \
              build/runtime-first-launch/undefined-symbols.txt; then
            echo "macOS/Vulkan-only frontend symbols still leak into first-launch runtime" >&2
            exit 1
          fi
      - name: Upload compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: ps5-win64-runtime-compile-census
          path: |
            build/runtime-census/results.tsv
            build/runtime-census/summary.txt
            build/runtime-census/logs/
            build/runtime-first-launch/results.tsv
            build/runtime-first-launch/receipt.txt
            build/runtime-first-launch/undefined-symbols.txt
            build/runtime-first-launch/symbols.txt
          if-no-files-found: error
          retention-days: 14
