name: PS5 portability inventory
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/test_ps5_portability_inventory.py'
      - 'patches/**'
      - 'config/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ps5-portability.yml'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static scanner tests
        run: python -m unittest discover -s tests -p test_ps5_portability_inventory.py -v
      - name: Generate portability report
        run: python scripts/ps5_portability_inventory.py --output build/ps5-portability.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ps5-portability-inventory
          path: build/ps5-portability.json
          if-no-files-found: error
