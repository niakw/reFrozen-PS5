name: PS5 portability inventory
on:
  pull_request:
    paths:
      - 'ps5/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/ps5/**'
      - 'tests/test_ps5_*.py'
      - 'patches/**'
      - 'config/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ps5-portability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static scanner tests
        run: python -m unittest discover -s tests -p 'test_ps5_*.py' -v
      - name: Generate portability report
        run: python scripts/ps5_portability_inventory.py --output build/ps5-portability.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ps5-portability-inventory
          path: build/ps5-portability.json
          if-no-files-found: error
  host-guest32:
    name: host guest32 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 fixture
        run: cmake -S tests/ps5 -B build/ps5-host -DCMAKE_BUILD_TYPE=Debug
      - name: Build with strict warnings
        run: cmake --build build/ps5-host --parallel 2
      - name: Test bounds and overlap semantics
        run: ctest --test-dir build/ps5-host --output-on-failure

  host-object-mode:
    name: host C++ object-only fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile synthetic guest fixture without linking
        run: |
          cmake -S tests/ps5 -B build/ps5-host-object -DCMAKE_BUILD_TYPE=Debug -DREFROZEN_PS5_COMPILE_ONLY=ON
          cmake --build build/ps5-host-object --target guest32_ranges_compile guest64_ranges_compile exact_guest_reservation_compile pe_image_materializer_compile direct_guest_backing_compile ps5_exact_reservation_adapter_compile ps5_direct_guest_backing_adapter_compile --parallel 2
          test -s build/ps5-host-object/CMakeFiles/guest32_ranges_compile.dir/guest32_ranges_test.cpp.o
          test -s build/ps5-host-object/CMakeFiles/guest64_ranges_compile.dir/guest64_ranges_test.cpp.o
          test -s build/ps5-host-object/CMakeFiles/exact_guest_reservation_compile.dir/exact_guest_reservation_test.cpp.o
          test -s build/ps5-host-object/CMakeFiles/pe_image_materializer_compile.dir/pe_image_materializer_test.cpp.o
          test -s build/ps5-host-object/CMakeFiles/direct_guest_backing_compile.dir/direct_guest_backing_test.cpp.o
          test -n "$(find build/ps5-host-object/CMakeFiles/ps5_exact_reservation_adapter_compile.dir -type f -name '*.o' -print -quit)"
          test -n "$(find build/ps5-host-object/CMakeFiles/ps5_direct_guest_backing_adapter_compile.dir -type f -name '*.o' -print -quit)"
      - name: Verify PS5 SDK smoke script fails closed without SDK
        run: |
          bash -n scripts/ps5/compile-guest32-object.sh
          if env -u PS5_PAYLOAD_SDK bash scripts/ps5/compile-guest32-object.sh > build/sdk-smoke-no-sdk.log 2>&1; then
            echo "SDK probe unexpectedly passed without PS5_PAYLOAD_SDK" >&2
            exit 1
          fi
          grep -q "PS5_PAYLOAD_SDK must point" build/sdk-smoke-no-sdk.log
