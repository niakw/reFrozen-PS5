name: PS5 x87/SSE SoftFloat object closure

on:
  pull_request:
    paths:
      - 'ps5/toolchain/payload-sdk-prospero.cmake'
      - 'tests/ps5/x87/CMakeLists.txt'
      - 'scripts/ps5/build-x87-softfloat-ps5.sh'
      - 'patches/x86recomp/**'
      - '.github/workflows/ps5-x87-softfloat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x87-softfloat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
      SOFTFLOAT_REF: 5c06db33fc1e2130f67c045327b0ec949032df1d
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl unzip ca-certificates clang-18 lld-18 llvm-18
      - name: Download and verify Payload SDK
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/sdk.zip
          printf "%s  %s\n" "$PS5_SDK_SHA256" build/sdk-download/sdk.zip | sha256sum --check --strict
          unzip -q build/sdk-download/sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang++
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/build/sdk-root/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Checkout exact Berkeley SoftFloat 3e source
        uses: actions/checkout@v4
        with:
          repository: ucb-bar/berkeley-softfloat-3
          ref: ${{ env.SOFTFLOAT_REF }}
          path: build/softfloat-src
          persist-credentials: false
      - name: Materialize exact patched x86recomp source
        run: |
          git clone --filter=blob:none https://github.com/JTM-rootstorm/x86recomp.git build/x86recomp
          cd build/x86recomp
          git checkout ad1b16b30b3cc049e47a1ebbf96e8066b32191e1
          for patch in "$GITHUB_WORKSPACE"/patches/x86recomp/*.patch; do git apply "$patch"; done
      - name: Build x87/SSE + SoftFloat for the PS5 ABI
        run: |
          bash -n scripts/ps5/build-x87-softfloat-ps5.sh
          bash scripts/ps5/build-x87-softfloat-ps5.sh \
            "$GITHUB_WORKSPACE/build/x86recomp" \
            "$GITHUB_WORKSPACE/build/softfloat-src" \
            "$GITHUB_WORKSPACE/build/ps5-x87-softfloat"
      - name: Inspect closure
        run: |
          OUT=build/ps5-x87-softfloat
          cat "$OUT/receipt.txt"
          cat "$OUT/elf-header.txt"
          if grep -E 'Warcraft|Blizzard|wc3fztprv|/home/runner/work/refrozen_ps5/' "$OUT/defined-symbols.txt" "$OUT/unresolved-symbols.txt"; then
            exit 1
          fi
      - name: Upload public x87/SoftFloat evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ps5-x87-softfloat-closure
          path: |
            build/ps5-x87-softfloat/receipt.txt
            build/ps5-x87-softfloat/elf-header.txt
            build/ps5-x87-softfloat/unresolved-symbols.txt
            build/ps5-x87-softfloat/defined-symbols.txt
          if-no-files-found: error
          retention-days: 7
