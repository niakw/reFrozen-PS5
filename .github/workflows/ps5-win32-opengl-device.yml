name: PS5 Win32 native OpenGL gfx Device compile/link

on:
  pull_request:
    paths:
      - 'ps5/runtime/x86recomp_ps5_gl_device.cpp'
      - 'ps5/graphics/**'
      - 'scripts/ps5/build-win32-opengl-device-probe.sh'
      - 'scripts/ps5/fetch-verified-opengl-sdk.sh'
      - 'scripts/ps5/patch_x86recomp_runtime_ps5.py'
      - 'patches/x86recomp/**'
      - 'tests/ps5/ps5_win32_opengl_device_link_probe.cpp'
      - '.github/workflows/ps5-win32-opengl-device.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
      OPENGL_ARCHIVE_SHA256: 30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate build recipes
        run: |
          bash -n scripts/ps5/build-win32-opengl-device-probe.sh
          bash -n scripts/ps5/fetch-verified-opengl-sdk.sh
      - name: Install host link tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential make git curl unzip ca-certificates \
            clang-18 lld-18 llvm-18
      - name: Download and verify Payload SDK v0.42
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/sdk.zip
          printf "%s  %s\n" "$PS5_SDK_SHA256" build/sdk-download/sdk.zip | sha256sum --check --strict
          unzip -q build/sdk-download/sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang++
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/build/sdk-root/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Fetch and verify preserved OpenGL SDK 1.0.2
        env:
          REFROZEN_PS5_OPENGL_ARCHIVE_SHA256: ${{ env.OPENGL_ARCHIVE_SHA256 }}
        run: |
          bash scripts/ps5/fetch-verified-opengl-sdk.sh build/ps5-opengl-sdk-1.0.2
          prefix="$(cat build/ps5-opengl-sdk-1.0.2/prefix.txt)"
          echo "PS5_OPENGL_PREFIX=$prefix" >> "$GITHUB_ENV"
          cat build/ps5-opengl-sdk-1.0.2/receipt.txt
      - name: Materialize exact patched x86recomp runtime
        run: |
          git clone --filter=blob:none https://github.com/JTM-rootstorm/x86recomp.git build/x86recomp
          cd build/x86recomp
          git checkout ad1b16b30b3cc049e47a1ebbf96e8066b32191e1
          for patch in "$GITHUB_WORKSPACE"/patches/x86recomp/*.patch; do git apply "$patch"; done
          cd "$GITHUB_WORKSPACE"
          python3 -B scripts/ps5/patch_x86recomp_runtime_ps5.py build/x86recomp
      - name: Compile and fully link PS5 OpenGL gfx Device
        run: |
          bash scripts/ps5/build-win32-opengl-device-probe.sh \
            "$GITHUB_WORKSPACE/build/x86recomp" \
            "$GITHUB_WORKSPACE/build/ps5-win32-opengl-device"
      - name: Qualify linked ELF
        run: |
          OUT=build/ps5-win32-opengl-device
          cat "$OUT/receipt.txt"
          cat "$OUT/SHA256SUMS"
          test -s "$OUT/refrozen-win32-opengl-device.elf"
          grep -Eq 'Machine:.*X86-64|Machine:.*x86-64' "$OUT/elf-metadata.txt"
          if strings "$OUT/refrozen-win32-opengl-device.elf" | grep -E 'Warcraft|Blizzard|/home/runner/work/refrozen_ps5/' > "$OUT/forbidden-strings.txt"; then
            cat "$OUT/forbidden-strings.txt" >&2
            exit 1
          fi
      - name: Upload public compiler/link evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ps5-win32-opengl-device-link
          path: |
            build/ps5-win32-opengl-device/receipt.txt
            build/ps5-win32-opengl-device/elf-metadata.txt
            build/ps5-win32-opengl-device/undefined-symbols.txt
            build/ps5-win32-opengl-device/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
