name: PS5 synthetic Win64 five-argument ABI chain

on:
  pull_request:
    paths:
      - 'scripts/ps5/synthetic_pe64_abi5_import.py'
      - 'scripts/ps5/build-win64-abi5-chain-elf.sh'
      - 'tests/test_ps5_synthetic_pe64_abi5_import.py'
      - 'tests/ps5/ps5_win64_import_handlers.c'
      - 'tests/ps5/ps5_win64_abi5_import_chain_main.cpp'
      - '.github/workflows/ps5-win64-abi5-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi5-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 curl unzip file
          python -m pip install --disable-pip-version-check capstone==5.0.6 lief==0.16.6
      - name: Checkout pinned MIT Win64 translator
        uses: actions/checkout@v4
        with:
          repository: NightSightProductions/Recomp-Framework
          ref: 63742ed02e039b292bbf341a33b3bb8c73457fea
          path: build/nightsight
          persist-credentials: false
      - name: Generate and translate ABI5 fixture
        run: |
          python -m unittest discover -s tests -p 'test_ps5_synthetic_pe64_abi5_import.py' -v
          python scripts/ps5/synthetic_pe64_abi5_import.py build/synthetic_win64_abi5.exe
          python -c 'import os,runpy,sys; os.cpu_count=lambda:2; sys.argv=["build/nightsight/tools/recomp64.py","build/synthetic_win64_abi5.exe","build/generated-abi5"]; runpy.run_path(sys.argv[0],run_name="__main__")' > build/translation-abi5.log
          cat build/translation-abi5.log
          grep -q "UNSUPPORTED: {}" build/translation-abi5.log
          grep -q "I_kernel32_dll_WriteFile" build/generated-abi5/code_0000.c
          grep -q "kernel32.dll!WriteFile" build/generated-abi5/tables.c
      - name: Execute five-argument ABI on Linux with PS5 contract shims
        run: |
          mkdir -p build/host-abi5
          python scripts/ps5/bin2cpp.py build/synthetic_win64_abi5.exe build/host-abi5/synthetic_abi5_pe_blob.cpp --symbol g_refrozen_synthetic_abi5_pe
          clang -std=gnu11 -O0 -Wno-unknown-pragmas -Ibuild/nightsight/runtime -Ibuild/generated-abi5 -c build/generated-abi5/code_0000.c -o build/host-abi5/code.o
          clang -std=gnu11 -O0 -Wno-unknown-pragmas -Ibuild/nightsight/runtime -Ibuild/generated-abi5 -c build/generated-abi5/tables.c -o build/host-abi5/tables.o
          clang -std=gnu11 -O0 -Wall -Wextra -Werror -Ibuild/nightsight/runtime -Ibuild/generated-abi5 -c tests/ps5/ps5_win64_import_handlers.c -o build/host-abi5/handlers.o
          clang++ -std=gnu++20 -O0 -Wall -Wextra -Werror -Wpedantic -Wconversion \
            -Ips5/host -Ips5/runtime -Ibuild/nightsight/runtime -Ibuild/generated-abi5 \
            tests/ps5/ps5_win64_abi5_import_chain_main.cpp \
            tests/ps5/ps5_win64_import_host_shims.cpp \
            build/host-abi5/synthetic_abi5_pe_blob.cpp \
            ps5/runtime/exact_reservation_ps5.cpp ps5/runtime/direct_guest_backing_ps5.cpp ps5/runtime/guest_image_mapping_ps5.cpp \
            build/host-abi5/code.o build/host-abi5/tables.o build/host-abi5/handlers.o \
            -o build/host-abi5/abi5-test
          ./build/host-abi5/abi5-test 2>&1 | tee build/host-abi5/execution.log
          grep -q "REFROZEN_PS5_ABI5_CHAIN pass=1" build/host-abi5/execution.log
          grep -q "calls=1 args_ok=1 fallback=0" build/host-abi5/execution.log
      - name: Download and verify Payload SDK v0.42
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/ps5-payload-sdk.zip
          printf '%s  %s\n' "$PS5_SDK_SHA256" build/sdk-download/ps5-payload-sdk.zip | sha256sum -c -
          unzip -q build/sdk-download/ps5-payload-sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang++
      - name: Link PS5 ABI5 probe ELF
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-root/ps5-payload-sdk
          NIGHTSIGHT_FW: ${{ github.workspace }}/build/nightsight
          REFROZEN_GENERATED_DIR: ${{ github.workspace }}/build/generated-abi5
          REFROZEN_SYNTHETIC_PE: ${{ github.workspace }}/build/synthetic_win64_abi5.exe
        run: bash scripts/ps5/build-win64-abi5-chain-elf.sh
      - name: Inspect ABI5 ELF
        run: |
          OUT=build/ps5-win64-abi5-chain
          ELF="$OUT/refrozen-synthetic-win64-abi5-chain.elf"
          file "$ELF" | tee "$OUT/file.txt"
          llvm-readelf-18 -h -l -d "$ELF" > "$OUT/elf-metadata.txt"
          llvm-nm-18 "$ELF" > "$OUT/symbols.txt"
          llvm-nm-18 -u "$ELF" > "$OUT/undefined-symbols.txt" || true
          sha256sum "$ELF" > "$OUT/SHA256SUMS"
          grep -E "[[:space:]][Tt][[:space:]]I_kernel32_dll_WriteFile$" "$OUT/symbols.txt"
          grep -q "g_refrozen_abi5_args_ok" "$OUT/symbols.txt"
          grep -q "REFROZEN_PS5_ABI5_CHAIN pass=1" <(strings "$ELF")
          for lib in libkernel_web.sprx libSceLibcInternal.sprx libSceNet.sprx; do grep -Fq "Shared library: [$lib]" "$OUT/elf-metadata.txt"; done
          if grep -qE '__atomic_|/lib(64)?/ld-linux|/libexec/ld-elf' "$OUT/undefined-symbols.txt" "$OUT/elf-metadata.txt"; then exit 1; fi
          if strings "$ELF" | grep -E '/home/runner/work/|Warcraft|Blizzard' > "$OUT/forbidden-strings.txt"; then cat "$OUT/forbidden-strings.txt" >&2; exit 1; fi
          cat "$OUT/SHA256SUMS"
      - name: Upload ABI5 proof
        uses: actions/upload-artifact@v4
        with:
          name: refrozen-ps5-synthetic-win64-abi5-chain
          path: |
            build/ps5-win64-abi5-chain/refrozen-synthetic-win64-abi5-chain.elf
            build/ps5-win64-abi5-chain/file.txt
            build/ps5-win64-abi5-chain/elf-metadata.txt
            build/ps5-win64-abi5-chain/undefined-symbols.txt
            build/ps5-win64-abi5-chain/SHA256SUMS
            build/translation-abi5.log
            build/host-abi5/execution.log
          if-no-files-found: error
          retention-days: 14
