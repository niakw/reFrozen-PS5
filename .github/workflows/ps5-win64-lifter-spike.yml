name: PS5 Win64 recompiler experiment (synthetic only)
on:
  pull_request:
    paths:
      - 'scripts/ps5/synthetic_pe64.py'
      - 'scripts/ps5/synthetic_pe64_memory.py'
      - 'tests/test_ps5_synthetic_pe64.py'
      - 'tests/test_ps5_synthetic_pe64_memory.py'
      - 'tests/ps5/win64_lift_runtime_test.c'
      - 'tests/ps5/win64_identity_memory_test.c'
      - 'tests/ps5/win64_materialized_image_test.cpp'
      - 'tests/ps5/win64_ps5_full_chain_test.cpp'
      - 'ps5/runtime/**'
      - 'ps5/host/pe_image_materializer.hpp'
      - '.github/workflows/ps5-win64-lifter-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  night-sight-win64-lift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned MIT-licensed Win64 lifter
        uses: actions/checkout@v4
        with:
          repository: NightSightProductions/Recomp-Framework
          ref: 63742ed02e039b292bbf341a33b3bb8c73457fea
          path: build/nightsight
          persist-credentials: false
      - name: Install Python lifter dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.6 lief==0.16.6
      - name: Generate minimal Win64 test PE
        run: |
          python -m unittest discover -s tests -p 'test_ps5_synthetic_pe64.py' -v
          python scripts/ps5/synthetic_pe64.py build/synthetic_win64.exe
      - name: Translate Win64 synthetic executable
        run: |
          python -c 'import os,runpy,sys; os.cpu_count=lambda:2; sys.argv=["build/nightsight/tools/recomp64.py","build/synthetic_win64.exe","build/generated"]; runpy.run_path(sys.argv[0],run_name="__main__")' > build/translation.log
          cat build/translation.log
          test -s build/generated/code_0000.c
          grep -q "void F_140001000" build/generated/code_0000.c
          grep -q "UNSUPPORTED: {}" build/translation.log
      - name: Compile translated synthetic code on x86-64 host
        run: |
          clang -std=gnu11 -O0 -Wno-unknown-pragmas -Ibuild/nightsight/runtime -Ibuild/generated -c build/generated/code_0000.c -o build/generated/synthetic-lift.o
          test -s build/generated/synthetic-lift.o
      - name: Execute translated Win64 function and verify CPU semantics
        run: |
          clang -std=gnu11 -O0 -Ibuild/nightsight/runtime -Ibuild/generated tests/ps5/win64_lift_runtime_test.c build/generated/synthetic-lift.o -o build/synthetic-lift-test
          ./build/synthetic-lift-test
      - name: Generate and translate Win64 identity-memory PE
        run: |
          python -m unittest discover -s tests -p 'test_ps5_synthetic_pe64_memory.py' -v
          python scripts/ps5/synthetic_pe64_memory.py build/synthetic_win64_memory.exe
          python -c 'import os,runpy,sys; os.cpu_count=lambda:2; sys.argv=["build/nightsight/tools/recomp64.py","build/synthetic_win64_memory.exe","build/generated-memory"]; runpy.run_path(sys.argv[0],run_name="__main__")' > build/translation-memory.log
          cat build/translation-memory.log
          test -s build/generated-memory/code_0000.c
          grep -q "void F_140001000" build/generated-memory/code_0000.c
          grep -q "0x140002000" build/generated-memory/code_0000.c
          grep -q "UNSUPPORTED: {}" build/translation-memory.log
      - name: Execute translated RIP-relative load/store at preferred guest VA
        run: |
          clang -std=gnu11 -O0 -Wno-unknown-pragmas -Ibuild/nightsight/runtime -Ibuild/generated-memory -c build/generated-memory/code_0000.c -o build/generated-memory/synthetic-memory-lift.o
          clang -std=gnu11 -O0 -Ibuild/nightsight/runtime -Ibuild/generated-memory tests/ps5/win64_identity_memory_test.c build/generated-memory/synthetic-memory-lift.o -o build/synthetic-memory-test
          ./build/synthetic-memory-test
      - name: Materialize whole synthetic PE at preferred VA and execute translated code
        run: |
          clang++ -std=gnu++20 -O0 -Ips5/host -Ibuild/nightsight/runtime -Ibuild/generated-memory tests/ps5/win64_materialized_image_test.cpp build/generated-memory/synthetic-memory-lift.o -o build/synthetic-materialized-image-test
          ./build/synthetic-materialized-image-test build/synthetic_win64_memory.exe
      - name: Execute full PS5-wrapper synthetic Win64 chain
        run: |
          clang++ -std=gnu++20 -O0 \
            -Ips5/host -Ips5/runtime -Ibuild/nightsight/runtime -Ibuild/generated-memory \
            tests/ps5/win64_ps5_full_chain_test.cpp \
            ps5/runtime/exact_reservation_ps5.cpp \
            ps5/runtime/direct_guest_backing_ps5.cpp \
            ps5/runtime/guest_image_mapping_ps5.cpp \
            build/generated-memory/synthetic-memory-lift.o \
            -o build/ps5-wrapper-full-chain-test
          ./build/ps5-wrapper-full-chain-test build/synthetic_win64_memory.exe
      - name: Preserve synthetic-lift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win64-lifter-synthetic-proof
          path: |
            build/translation.log
            build/translation-memory.log
          if-no-files-found: ignore
