name: PS5 synthetic Win64 translated-chain ELF

on:
  pull_request:
    paths:
      - 'ps5/host/**'
      - 'ps5/runtime/**'
      - 'scripts/ps5/bin2cpp.py'
      - 'scripts/ps5/synthetic_pe64_memory.py'
      - 'scripts/ps5/build-win64-chain-elf.sh'
      - 'scripts/ps5/compile-win64-generated-objects.sh'
      - 'tests/ps5/ps5_win64_chain_main.cpp'
      - 'tests/test_ps5_bin2cpp.py'
      - '.github/workflows/ps5-win64-chain-elf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-translated-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PS5_SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
      PS5_SDK_SHA256: 8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da
      NIGHTSIGHT_COMMIT: 63742ed02e039b292bbf341a33b3bb8c73457fea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLVM 18 and Python translator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 curl unzip file
          python -m pip install --disable-pip-version-check capstone==5.0.6 lief==0.16.6

      - name: Checkout pinned MIT Win64 translator
        uses: actions/checkout@v4
        with:
          repository: NightSightProductions/Recomp-Framework
          ref: 63742ed02e039b292bbf341a33b3bb8c73457fea
          path: build/nightsight
          persist-credentials: false

      - name: Generate and translate public Win64 memory fixture
        run: |
          python -m unittest discover -s tests -p 'test_ps5_bin2cpp.py' -v
          python scripts/ps5/synthetic_pe64_memory.py build/synthetic_win64_memory.exe
          python -c 'import os,runpy,sys; os.cpu_count=lambda:2; sys.argv=["build/nightsight/tools/recomp64.py","build/synthetic_win64_memory.exe","build/generated-memory"]; runpy.run_path(sys.argv[0],run_name="__main__")' > build/translation-memory.log
          cat build/translation-memory.log
          test -s build/generated-memory/code_0000.c
          test -s build/generated-memory/tables.c
          grep -q "gentry" build/generated-memory/tables.c
          grep -q "void F_140001000" build/generated-memory/code_0000.c
          grep -q "0x140002000" build/generated-memory/code_0000.c
          grep -q "UNSUPPORTED: {}" build/translation-memory.log

      - name: Download and verify Payload SDK v0.42
        run: |
          mkdir -p build/sdk-download build/sdk-root
          curl --fail --location --retry 3 --retry-delay 2 "$PS5_SDK_URL" -o build/sdk-download/ps5-payload-sdk.zip
          printf '%s  %s\n' "$PS5_SDK_SHA256" build/sdk-download/ps5-payload-sdk.zip | sha256sum -c -
          unzip -q build/sdk-download/ps5-payload-sdk.zip -d build/sdk-root
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang
          test -x build/sdk-root/ps5-payload-sdk/bin/prospero-clang++

      - name: Link PS5 translated Win64 chain
        env:
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/build/sdk-root/ps5-payload-sdk
          NIGHTSIGHT_FW: ${{ github.workspace }}/build/nightsight
          REFROZEN_GENERATED_DIR: ${{ github.workspace }}/build/generated-memory
          REFROZEN_SYNTHETIC_PE: ${{ github.workspace }}/build/synthetic_win64_memory.exe
        run: |
          bash -n scripts/ps5/compile-win64-generated-objects.sh
          bash scripts/ps5/build-win64-chain-elf.sh
          test -s build/ps5-win64-chain/refrozen-synthetic-win64-chain.elf
          grep -q 'REFROZEN_PS5_GENERATED_OBJECTS pass=1 code_files=1 objects=2' build/ps5-win64-chain/generated-objects/receipt.txt

      - name: Inspect translated-chain ELF
        run: |
          ELF=build/ps5-win64-chain/refrozen-synthetic-win64-chain.elf
          file "$ELF" | tee build/ps5-win64-chain/file.txt
          llvm-readelf-18 -h -l -d "$ELF" > build/ps5-win64-chain/elf-metadata.txt
          llvm-nm-18 "$ELF" > build/ps5-win64-chain/symbols.txt
          llvm-nm-18 -u "$ELF" > build/ps5-win64-chain/undefined-symbols.txt || true
          sha256sum "$ELF" > build/ps5-win64-chain/SHA256SUMS
          grep -Eq 'Machine:.*X86-64|Machine:.*x86-64' build/ps5-win64-chain/elf-metadata.txt
          grep -Eq 'Type:.*DYN' build/ps5-win64-chain/elf-metadata.txt
          grep -q "F_140001000" build/ps5-win64-chain/symbols.txt
          for symbol in gentry gfuncs ngfuncs gsections ngsections gimage_base gimage_size; do
            grep -q "$symbol" build/ps5-win64-chain/symbols.txt
          done
          grep -q "g_refrozen_synthetic_pe" build/ps5-win64-chain/symbols.txt
          grep -q "REFROZEN_PS5_WIN64_CHAIN pass=1" <(strings "$ELF")
          for lib in libkernel_web.sprx libSceLibcInternal.sprx libSceNet.sprx; do
            grep -Fq "Shared library: [$lib]" build/ps5-win64-chain/elf-metadata.txt
          done
          for symbol in sceKernelAllocateDirectMemory sceKernelGetDirectMemorySize sceKernelMapDirectMemory sceKernelReleaseDirectMemory sceKernelReserveVirtualRange munmap; do
            grep -q "$symbol" build/ps5-win64-chain/undefined-symbols.txt
          done
          if grep -qE '__atomic_|/lib(64)?/ld-linux|/libexec/ld-elf' build/ps5-win64-chain/undefined-symbols.txt build/ps5-win64-chain/elf-metadata.txt; then
            echo "Unexpected host/atomic runtime dependency" >&2
            exit 1
          fi
          if strings "$ELF" | grep -E '/home/runner/work/|Warcraft|Blizzard' > build/ps5-win64-chain/forbidden-strings.txt; then
            echo "Unexpected build path or proprietary-game marker in synthetic ELF" >&2
            cat build/ps5-win64-chain/forbidden-strings.txt >&2
            exit 1
          fi
          cat build/ps5-win64-chain/SHA256SUMS

      - name: Upload translated synthetic PS5 chain
        uses: actions/upload-artifact@v4
        with:
          name: refrozen-ps5-synthetic-win64-chain
          path: |
            build/ps5-win64-chain/refrozen-synthetic-win64-chain.elf
            build/ps5-win64-chain/file.txt
            build/ps5-win64-chain/elf-metadata.txt
            build/ps5-win64-chain/undefined-symbols.txt
            build/ps5-win64-chain/SHA256SUMS
            build/translation-memory.log
          if-no-files-found: error
          retention-days: 14
